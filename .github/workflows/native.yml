name: native-builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    env:
      WINDOWS_FFMPEG_VERSION: '7.1.1'
      WINDOWS_FFMPEG_SHA256: '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare Linux GCC and dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-13 libssl-dev ninja-build ffmpeg
          echo 'CXX=g++-13' >> "$GITHUB_ENV"
      - name: Prepare macOS compiler and matching standard library
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install llvm@20 openssl@3 ffmpeg
          llvm_root="$(brew --prefix llvm@20)"
          echo "CXX=$llvm_root/bin/clang++" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-nostdinc++ -isystem $llvm_root/include/c++/v1" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$llvm_root/lib/c++ -Wl,-rpath,$llvm_root/lib/c++" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Prepare native Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Cache pinned Windows FFmpeg archive
        if: runner.os == 'Windows'
        continue-on-error: true # Cache availability is optional; setup validation stays fatal.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/world-explorer-ffmpeg-cache/ffmpeg-${{ env.WINDOWS_FFMPEG_VERSION }}-essentials_build.zip
          key: windows-x64-ffmpeg-${{ env.WINDOWS_FFMPEG_VERSION }}-${{ env.WINDOWS_FFMPEG_SHA256 }}
      - name: Prepare pinned Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:WINDOWS_FFMPEG_VERSION
          $expected_hash = $env:WINDOWS_FFMPEG_SHA256
          $archive_name = "ffmpeg-${version}-essentials_build.zip"
          $cache_dir = Join-Path $env:RUNNER_TEMP 'world-explorer-ffmpeg-cache'
          $archive = Join-Path $cache_dir $archive_name
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) {
            New-Item -ItemType Directory -Force -Path $cache_dir | Out-Null
            $partial = "$archive.part"
            $url = "https://github.com/GyanD/codexffmpeg/releases/download/${version}/${archive_name}"
            curl.exe --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 --max-filesize 100000000 --output $partial $url
            if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg archive download failed after bounded retries (curl exit $LASTEXITCODE)"
            }
            if ((Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash -ne $expected_hash) {
              throw 'Downloaded FFmpeg archive SHA-256 mismatch'
            }
            Move-Item -LiteralPath $partial -Destination $archive -Force
          }
          # Cache hits are untrusted until checked against the repository pin.
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected_hash) {
            throw 'Cached FFmpeg archive SHA-256 mismatch'
          }
          $install_dir = Join-Path $env:RUNNER_TEMP 'world-explorer-ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $install_dir -Force
          $bin = Join-Path $install_dir "ffmpeg-${version}-essentials_build/bin"
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $executable = Join-Path $bin "$tool.exe"
            if (!(Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Pinned FFmpeg archive is missing $tool.exe"
            }
            $version_output = @(& $executable -version)
            $pattern = '^' + $tool + ' version ' + [regex]::Escape($version) + '(?:-|\s)'
            if ($LASTEXITCODE -ne 0 -or $version_output[0] -notmatch $pattern) {
              throw "Pinned $tool failed its version preflight"
            }
            Write-Output $version_output[0]
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Locate Windows OpenSSL SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl_root = Join-Path $env:ProgramFiles 'OpenSSL'
          if (!(Test-Path "$openssl_root/include/openssl/evp.h")) {
            throw "The runner's full OpenSSL SDK is missing: $openssl_root"
          }
          "OPENSSL_ROOT_DIR=$openssl_root" >> $env:GITHUB_ENV
          'CXX=cl' >> $env:GITHUB_ENV
      - name: Verify worker runtime tools
        run: python -c "import subprocess; subprocess.run(['ffmpeg', '-version'], check=True); subprocess.run(['ffprobe', '-version'], check=True)"
      - name: Configure explicit C++23 compatibility core
        run: cmake --preset compat-cxx23 -DWE_BUILD_VIEWER=OFF
      - name: Build
        run: cmake --build --preset compat-cxx23 --parallel 4
      - name: CPU contracts
        run: ctest --preset compat-cxx23
      - name: Include boundaries
        run: python tools/check_boundaries.py
      - name: Documentation links
        run: python tools/check_docs.py
  linux-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare Clang 19 and GCC 13 standard library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-19 g++-13 libssl-dev ninja-build ffmpeg
          echo 'CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' >> "$GITHUB_ENV"
      - name: Verify worker runtime tools
        run: python -c "import subprocess; subprocess.run(['ffmpeg', '-version'], check=True); subprocess.run(['ffprobe', '-version'], check=True)"
      - name: Configure explicit C++23 Clang core
        run: cmake --preset clang -DCMAKE_CXX_COMPILER=clang++-19 -DWE_CXX_STANDARD=23 -DWE_BUILD_VIEWER=OFF
      - run: cmake --build --preset clang --parallel 4
      - run: ctest --preset clang
      - name: Include boundaries
        run: python tools/check_boundaries.py
      - name: Documentation links
        run: python tools/check_docs.py
